name: DOCKER-AUTH-TEST

permissions:
  id-token: write

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Login to DockerHub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ secrets.DOCKERHUB_OIDC_CONNECTIONID }}
        with:
          username: ${{ secrets.DOCKER_OIDC_USERNAME }}

      - name: Verify Docker login
        run: |
          docker info

      - name: Query Docker Registry tags
        run: |
          curl -fsSL \
            https://registry-1.docker.io/v2/library/eclipse-temurin/tags/list \
            | jq .