name: DOCKER-AUTH-TEST

permissions:
  id-token: write

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Login to DockerHub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ secrets.DOCKERHUB_OIDC_CONNECTIONID }}
        with:
          username: ${{ secrets.DOCKER_OIDC_USERNAME }}

      - name: Verify DockerHub authentication
        run: |
          docker info

      - name: Get Docker Registry token
        id: registry-token
        run: |
          registry="https://registry-1.docker.io"
          repository="library/eclipse-temurin"

          response=$(curl -sSI \
            "$registry/v2/$repository/tags/list")

          echo "$response"

          auth_header=$(echo "$response" | grep -i '^www-authenticate:' | tr -d '\r')

          if [ -z "$auth_header" ]; then
            echo "No authentication challenge returned."
            exit 1
          fi

          realm=$(echo "$auth_header" | sed -n 's/.*realm="\([^"]*\)".*/\1/p')
          service=$(echo "$auth_header" | sed -n 's/.*service="\([^"]*\)".*/\1/p')
          scope=$(echo "$auth_header" | sed -n 's/.*scope="\([^"]*\)".*/\1/p')

          echo "Realm: $realm"
          echo "Service: $service"
          echo "Scope: $scope"

          token=$(curl -fsSL \
            --get \
            --data-urlencode "service=$service" \
            --data-urlencode "scope=$scope" \
            "$realm" \
            | jq -r '.token // .access_token')

          if [ -z "$token" ] || [ "$token" = "null" ]; then
            echo "Failed to obtain registry token."
            exit 1
          fi

          echo "Registry token obtained."

          echo "Querying tags..."

          curl -fsSL \
            -H "Authorization: Bearer $token" \
            "$registry/v2/$repository/tags/list" \
            | jq .