name: NIGHTLY-SCAN

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  get-matrix-values:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.set-var.outputs.image }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: set-var
        run: |
          echo 'image<<EOF' >> $GITHUB_OUTPUT
          cat ./image-matrix.json >> $GITHUB_OUTPUT
          echo 'EOF' >> $GITHUB_OUTPUT

  scan:
    runs-on: ubuntu-latest
    needs: get-matrix-values
    strategy:
      fail-fast: false
      matrix:
        image: ${{fromJSON(needs.get-matrix-values.outputs.image)}}

    steps:
      - name: Run Anchore Grype scan
        id: grype-scan
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: defradigital/java:${{ matrix.image.tags[0] }}
          fail-build: false
          severity-cutoff: "medium"
          output-format: json
        continue-on-error: true

      - name: Run Aqua Trivy scan
        id: trivy-scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: defradigital/java:${{ matrix.image.tags[0] }}
          format: json
          output: trivy-java-${{ matrix.image.tags[0] }}.json
          exit-code: 0
          vuln-type: os,library
          severity: CRITICAL,HIGH,MEDIUM
        continue-on-error: true

      - name: Upload Grype report
        if: steps.grype-scan.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: grype-java-${{ matrix.image.tags[0] }}
          path: ${{ steps.grype-scan.outputs.json }}
          if-no-files-found: ignore

      - name: Upload Trivy report
        if: steps.trivy-scan.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-java-${{ matrix.image.tags[0] }}
          path: trivy-java-${{ matrix.image.tags[0] }}.json
          if-no-files-found: ignore

  report:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    needs: scan
    if: always()
    env:
      GH_TOKEN: ${{ github.token }}
      LABEL: "security-scan" # gh label create "security-scan" --description "Overnight Security Scan" --color A52A2A
      TITLE: "Nightly vulnerability scan"
      REVIEW_TEAM: ${{ vars.PR_REVIEW_TEAM }}
    steps:
      # gh needs a repo context to target; nothing else in this job needs the checkout.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Download scan reports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
        continue-on-error: true

      - name: Build findings summary
        id: summary
        run: |
          for d in artifacts/grype-java-*; do
            build=$(echo $d | sed 's/artifacts\/grype\-//g')
            for f in artifacts/grype-java-*/output; do
              [ -e "$f" ] || continue
              jq --arg build "$build" -r '
                (.matches // [])[] |
                [ 
                  ($build),
                  (.vulnerability.severity // "Unknown" | ascii_upcase),
                  (.vulnerability.id // ""),
                  (.artifact.name // ""),
                  (.artifact.version // ""),
                  (if (.vulnerability.fix.state // "") == "fixed" then "FIX_AVAILABLE" else "FIX_NOT_AVAILABLE" end),
                  ((.vulnerability.fix.versions // []) | join(",")),
                  ((.artifact.locations // []) | map(.path) | join(",")) 
                ] | @tsv
              ' "$f" >> findings.tsv || true
            done
          done
          
          for d in artifacts/trivy-java-*; do
            build=$(echo $d | sed 's/artifacts\/trivy\-//g')
            for f in artifacts/trivy-java-*/*.json; do
              [ -e "$f" ] || continue
              jq --arg build "$build" -r '
                (.Results // [])[] | . as $result | ($result.Vulnerabilities // [])[] |
                [ 
                  ($build),
                  (.Severity // "UNKNOWN" | ascii_upcase),
                  (.VulnerabilityID // ""),
                  (.PkgName // ""),
                  (.InstalledVersion // ""),
                  (if (.FixedVersion // "") != "" then "FIX_AVAILABLE" else "FIX_NOT_AVAILABLE" end),
                  (.FixedVersion // ""),
                  (($result.Target // "") + "," + (.PkgPath // "")) 
                ] | @tsv
              ' "$f" >> findings.tsv || true
            done
          done

          total=$(cat findings.tsv | wc -l)
          fixable_count=$(cat findings.tsv | grep FIX_AVAILABLE | wc -l)
          builds=$(cat findings.tsv | awk -F'\t' '{print $1}' | sort -u)
          
          render_output() {
            file="findings.tsv"
            if [ -s "$file" ]; then              
              for build in $builds; do
                build_total=$(cat $file | grep $build | wc -l)
                build_critical=$(cat $file | grep $build | grep CRITICAL | wc -l)
                build_high=$(cat $file | grep $build | grep HIGH | wc -l)
                build_medium=$(cat $file | grep $build | grep MEDIUM | wc -l)
                build_fix_available=$(cat $file | grep $build | grep FIX_AVAILABLE | wc -l)
                build_fix_not_available=$(cat $file | grep $build | grep FIX_NOT_AVAILABLE | wc -l)
                grype_id=$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts | jq '.artifacts[]|select(.name == "grype-${build}")).id')
                echo "GRYPE_ID:$grype_id"
                trivy_id=$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts | jq '.artifacts[]|select(.name == "trivy-${build}")).id')
                echo "TRIVY_ID:$trivy_id"
                grype_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts/${grype_id}"
                trivy_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts/${trivy_id}"
                echo "### $build"
                echo "[Grype](${grype_url})"
                echo "[Trivy](${trivy_url})"
                echo "| Total | Critical | High | Medium | Fix Available | No Fix Available |"
                echo "|---|---|---|---|---|---|"
                echo "|$build_total|$build_critical|$build_high|$build_medium|$build_fix_available|$build_fix_not_available|"
                echo
              done
            else
              echo "_None._"
            fi
          }

          {
            echo "_Updated $(date -u '+%Y-%m-%d %H:%M UTC') from the nightly scan of the published images._"
            echo "There are $total vulnerabilities accross $(echo $builds | wc -l) images."
            echo
            render_output
            echo
          } > body.md

          echo "fixable_count=$fixable_count" >> $GITHUB_OUTPUT
          echo "total=$total" >> $GITHUB_OUTPUT

      - name: Update tracking issue
        run: |
          fixable=${{ steps.summary.outputs.fixable_count }}
          total=${{ steps.summary.outputs.total }}

          number=$(gh issue list --label "$LABEL" --state all --limit 1 --json number --jq '.[0].number // empty')
          state=""
          if [ -n "$number" ]; then
            state=$(gh issue view "$number" --json state --jq '.state')
          fi

          # Nothing to report: close the issue if one is open, otherwise do nothing.
          if [ "$total" -eq 0 ]; then
            if [ -n "$number" ] && [ "$state" = "OPEN" ]; then
              gh issue edit "$number" --body-file body.md
              gh issue close "$number" --reason completed || true
            fi
            echo "No medium+ findings."
            exit 0
          fi

          if [ -z "$number" ]; then
            url=$(gh issue create --title "$TITLE" --label "$LABEL" --body-file body.md)
            number=${url##*/}
            state="OPEN"
          else
            gh issue edit "$number" --body-file body.md
          fi

          # Notify only when newly actionable, so an already-open issue updates silently.
          if [ "$fixable" -gt 0 ] && [ "$state" != "OPEN" ]; then
            gh issue reopen "$number" || true
            if [ -n "$REVIEW_TEAM" ]; then
              gh issue comment "$number" --body "Fixable vulnerabilities detected in the published images. cc @${REVIEW_TEAM}"
            fi
          fi