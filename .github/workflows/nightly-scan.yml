name: NIGHTLY-SCAN

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  get-matrix-values:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.set-var.outputs.image }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: set-var
        run: |
          echo 'image<<EOF' >> $GITHUB_OUTPUT
          cat ./image-matrix.json >> $GITHUB_OUTPUT
          echo 'EOF' >> $GITHUB_OUTPUT

  scan:
    runs-on: ubuntu-latest
    needs: get-matrix-values
    strategy:
      fail-fast: false
      matrix:
        image: ${{fromJSON(needs.get-matrix-values.outputs.image)}}

    steps:
      - name: Run Anchore Grype scan
        id: grype-scan
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: defradigital/java:${{ matrix.image.tags[0] }}
          fail-build: false
          severity-cutoff: "medium"
          output-format: json
        continue-on-error: true

      - name: Run Aqua Trivy scan
        id: trivy-scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: defradigital/java:${{ matrix.image.tags[0] }}
          format: json
          output: trivy-java-${{ matrix.image.tags[0] }}.json
          exit-code: 0
          vuln-type: os,library
          severity: CRITICAL,HIGH,MEDIUM
        continue-on-error: true

      - name: Upload Grype report
        if: steps.grype-scan.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: grype-java-${{ matrix.image.tags[0] }}
          path: ${{ steps.grype-scan.outputs.json }}
          if-no-files-found: ignore

      - name: Upload Trivy report
        if: steps.trivy-scan.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-java-${{ matrix.image.tags[0] }}
          path: trivy-java-${{ matrix.image.tags[0] }}.json
          if-no-files-found: ignore

  report:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    needs: scan
    if: always()
    env:
      GH_TOKEN: ${{ github.token }}
      LABEL: "security-scan" # gh label create "security-scan" --description "Overnight Security Scan" --color A52A2A
      TITLE: "Nightly vulnerability scan"
      REVIEW_TEAM: ${{ vars.PR_REVIEW_TEAM }}
    steps:
      # gh needs a repo context to target; nothing else in this job needs the checkout.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Download scan reports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
        continue-on-error: true

      - name: Build findings summary
        id: summary
        run: |
          for d in artifacts/grype-java-*; do
            build=$(echo $d | sed 's/grype\-//g')
            for f in artifacts/grype-java-*/output; do            
              [ -e "$f" ] || continue
              jq --arg build "$build" -r '
                (.matches // [])[] |
                [ 
                  ($build),
                  (.vulnerability.severity // "Unknown" | ascii_upcase),
                  (.vulnerability.id // ""),
                  (.artifact.name // ""),
                  (.artifact.version // ""),
                  (if (.vulnerability.fix.state // "") == "fixed" then "FIX_AVAILABLE" else "FIX_NOT_AVAILABLE" end),
                  ((.vulnerability.fix.versions // []) | join(",")),
                  ((.artifact.locations // []) | map(.path) | join(",")) 
                ] | @tsv
              ' "$f" >> findings.tsv || true
            done
          done
          
          for d in artifacts/trivy-java-*; do
            build=$(echo $d | sed 's/trivy\-//g')
            for f in artifacts/trivy-java-*/*.json; do
              [ -e "$f" ] || continue
              jq --arg build "$build" -r '
                (.Results // [])[] | . as $result | ($result.Vulnerabilities // [])[] |
                [ 
                  ($build),
                  (.Severity // "UNKNOWN" | ascii_upcase),
                  (.VulnerabilityID // ""),
                  (.PkgName // ""),
                  (.InstalledVersion // ""),
                  (if (.FixedVersion // "") != "" then "FIX_AVAILABLE" else "FIX_NOT_AVAILABLE" end),
                  (.FixedVersion // ""),
                  (($result.Target // "") + "," + (.PkgPath // "")) 
                ] | @tsv
              ' "$f" >> findings.tsv || true
            done
          done

          grep -E '(MEDIUM|HIGH|CRITICAL)	' findings.tsv | sort -u > medplus.tsv || true

          cat medplus.tsv | grep FIX_AVAILABLE > fix_available.tsv
          fix_available_count=$(cat fix_available.tsv | wc -l)
          cat medplus.tsv | grep FIX_NOT_AVAILABLE > fix_not_available.tsv
          fix_not_available_count=$(cat fix_not_available.tsv | wc -l)
          total=$((fix_available_count + fix_not_available_count))        
          builds=$(cat medplus.tsv | awk -F'\t' '{print $1}' | sort -u)
          limit=5

          render_fix_available() {
            file="fix_available.tsv"
            if [ -s "$file" ]; then
              for build in $builds; do
                echo "| Severity | ID | Package | Current Version | Fixed Version |"
                echo "|---|---|---|---|---|"
                cat "$file" | grep $build | awk -F'\t' '{print "| "$2" | "$3" | "$4" | "$5" | "$7" |"}' | head -$limit
              done
            else
              echo "_None._"
            fi
          }

          render_fix_not_available() {
            file="fix_not_available.tsv"
            if [ -s "$file" ]; then
              for build in $builds; do
                echo "| Severity | ID | Package | Current Version|"
                echo "|---|---|---|---|---|---|"
                cat "$file" | grep $build | awk -F'\t' '{print "| "$2" | "$3" | "$4" | "$5" |"}' | head -$limit
              done
            else
              echo "_None._"
            fi
          }

          {
            echo "_Updated $(date -u '+%Y-%m-%d %H:%M UTC') from the nightly scan of the published images._"
            echo "There are $total medium to high results accross $(wc -l $builds) images."
            echo 
            echo "## Fix available (first $limit of $fix_available_count)"
            echo
            render_fix_available
            echo
            echo "## No fix available (first $limit of $fix_not_available_count)"
            echo
            render_fix_not_available
          } > body.md

          echo "fix_available_count=$fix_available_count" >> $GITHUB_OUTPUT
          echo "total=$total" >> $GITHUB_OUTPUT

      - name: Update tracking issue
        run: |
          fixable=${{ steps.summary.outputs.fixable_count }}
          total=${{ steps.summary.outputs.total }}

          number=$(gh issue list --label "$LABEL" --state all --limit 1 --json number --jq '.[0].number // empty')
          state=""
          if [ -n "$number" ]; then
            state=$(gh issue view "$number" --json state --jq '.state')
          fi

          # Nothing to report: close the issue if one is open, otherwise do nothing.
          if [ "$total" -eq 0 ]; then
            if [ -n "$number" ] && [ "$state" = "OPEN" ]; then
              gh issue edit "$number" --body-file body.md
              gh issue close "$number" --reason completed || true
            fi
            echo "No medium+ findings."
            exit 0
          fi

          if [ -z "$number" ]; then
            url=$(gh issue create --title "$TITLE" --label "$LABEL" --body-file body.md)
            number=${url##*/}
            state="OPEN"
          else
            gh issue edit "$number" --body-file body.md
          fi

          # Notify only when newly actionable, so an already-open issue updates silently.
          if [ "$fixable" -gt 0 ] && [ "$state" != "OPEN" ]; then
            gh issue reopen "$number" || true
            if [ -n "$REVIEW_TEAM" ]; then
              gh issue comment "$number" --body "Fixable vulnerabilities detected in the published images. cc @${REVIEW_TEAM}"
            fi
          fi