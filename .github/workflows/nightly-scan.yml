name: NIGHTLY-SCAN

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  get-matrix-values:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.set-var.outputs.image }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: set-var
        run: |
          echo 'image<<EOF' >> $GITHUB_OUTPUT
          cat ./image-matrix.json >> $GITHUB_OUTPUT
          echo 'EOF' >> $GITHUB_OUTPUT

  scan:
    runs-on: ubuntu-latest
    needs: get-matrix-values
    strategy:
      fail-fast: false
      matrix:
        image: ${{fromJSON(needs.get-matrix-values.outputs.image)}}

    steps:
      - name: Run Anchore Grype scan
        id: grype-scan
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: defradigital/java:${{ matrix.image.tags[0] }}
          fail-build: false
          severity-cutoff: "medium"
          output-format: json
        continue-on-error: true

      - name: Run Aqua Trivy scan
        id: trivy-scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: defradigital/java:${{ matrix.image.tags[0] }}
          format: json
          output: trivy-java-${{ matrix.image.tags[0] }}.json
          exit-code: 0
          vuln-type: os,library
          severity: CRITICAL,HIGH,MEDIUM
        continue-on-error: true

      - name: Upload Grype report
        if: steps.grype-scan.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: grype-java-${{ matrix.image.tags[0] }}
          path: ${{ steps.grype-scan.outputs.json }}
          if-no-files-found: ignore

      - name: Upload Trivy report
        if: steps.trivy-scan.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-java-${{ matrix.image.tags[0] }}
          path: trivy-java-${{ matrix.image.tags[0] }}.json
          if-no-files-found: ignore

  report:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    needs: scan
    if: always()
    env:
      GH_TOKEN: ${{ github.token }}
      LABEL: "security-scan" # gh label create "security-scan" --description "Overnight Security Scan" --color A52A2A
      TITLE: "Nightly vulnerability scan"
      REVIEW_TEAM: ${{ vars.PR_REVIEW_TEAM }}
    steps:
      # gh needs a repo context to target; nothing else in this job needs the checkout.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Download scan reports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
        continue-on-error: true

      - name: Build findings summary
        id: summary
        run: bash .github/scripts/generate_summary.sh

      - name: Update tracking issue
        run: bash .github/scripts/update_issue.sh